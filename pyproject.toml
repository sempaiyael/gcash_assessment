[project]
name = "gcash-assessment"
version = "0.1.0"
description = "Give Me The Next AAA Title — Predicting hit movies using IMDb data with FT-Transformer"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "smp_yael", email = "danyaelmanlangit@gmail.com" }]
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.0",
    "pytorch-tabular>=1.2.0",
    "scikit-learn>=1.9.1",
    "scikit-surprise>=1.1.5",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "torch==2.14.1+cu130",
    "xgboost>=3.4.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
